databases:
  - name: bookerbox-db
    plan: free

services:
  - type: web
    name: bookerbox-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookerbox-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
